# CLIPPERZ standard edit worker.
# Triggered by CLIPPERZ (repository_dispatch "clipperz-edit"): raw short video from Drive ->
# rough cut -> LUT-graded B-roll photos on top -> Submagic captions in the house style.
name: clipperz-edit
on:
  repository_dispatch:
    types: [clipperz-edit]
concurrency:
  group: clipperz-edit-${{ github.event.client_payload.edit }}
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: worker
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          # The worker decodes audio with ffmpeg itself, so the PyAV version does not matter (any wheel works).
          pip install -q -U gdown pillow pillow-heif requests requests-toolbelt "faster-whisper==1.2.1"
          python3 -c "import av, faster_whisper; print('av', av.__version__, '· faster-whisper', faster_whisper.__version__)"
      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1
      # The payload (edit token, callback URL) is read from the event file inside the script,
      # never passed through env – step env values appear in the logs.
      - name: Edit
        id: edit
        run: python3 worker/clipperz_edit.py
      # If anything before the script fails (e.g. installing tools), tell CLIPPERZ so the edit
      # does not hang on "Wartet auf Worker". Payload comes from the event file, nothing is printed.
      - name: Report setup failure
        if: failure() && steps.edit.outcome != 'failure'
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          p = json.load(open(os.environ["GITHUB_EVENT_PATH"]))["client_payload"]
          q = urllib.parse.urlencode({"edit": p["edit"], "k": p["token"]})
          body = json.dumps({"status": "failed", "error": "Worker konnte nicht starten – bitte „Nochmal versuchen“."}).encode()
          req = urllib.request.Request(p["api"].rstrip("/") + "/edit-status?" + q, data=body, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=30)
          except Exception as e:
              print("status update failed:", type(e).__name__)
          PY
