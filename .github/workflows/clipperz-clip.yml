# CLIPPERZ Pro clipping worker (development runner).
# Triggered by CLIPPERZ (repository_dispatch "clipperz-clip"): long video -> transcript -> Claude picks moments ->
# vertical reframe -> render in the editor style -> clips back to CLIPPERZ.
# For paying customers the same script runs on our own servers:
#   python3 worker/clipperz_clip.py --job "<api>/clip-config?stream=<id>&k=<token>"
name: clipperz-clip
on:
  repository_dispatch:
    types: [clipperz-clip]
concurrency:
  group: clipperz-clip-${{ github.event.client_payload.stream }}
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # Full checkout: the renderer uses src/ (Remotion + Editing Library) and public/lib, public/music.
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U yt-dlp requests numpy "opencv-python-headless<5" "faster-whisper==1.2.1"
          npm ci --no-audit --no-fund
          npx remotion browser ensure
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # v2: + large-v3-turbo (CLIPPERZ Pro re-transcribes the picked clips with it); restores v1 (small/medium) first
          key: whisper-clip-v2
          restore-keys: whisper-clip-
      # The payload (stream token, callback URL) is read from the event file inside the script,
      # never passed through env or arguments here – this repo is public and step env values appear in the logs.
      - name: Clip
        id: clip
        run: python3 worker/clipperz_clip.py
      # If the job dies before or outside the script (setup error, timeout, cancel), tell CLIPPERZ so the run
      # ends and the credits are refunded. Nothing from the payload is printed.
      - name: Report failure
        if: (failure() || cancelled()) && steps.clip.outcome != 'failure'
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          p = json.load(open(os.environ["GITHUB_EVENT_PATH"]))["client_payload"]
          q = urllib.parse.urlencode({"stream": p["stream"], "k": p["token"]})
          body = json.dumps({"status": "failed", "error": "Worker wurde abgebrochen – Credits sind zurück, bitte nochmal starten."}).encode()
          req = urllib.request.Request(p["api"].rstrip("/") + "/clip-status?" + q, data=body, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=30)
          except Exception as e:
              print("status update failed:", type(e).__name__)
          PY
